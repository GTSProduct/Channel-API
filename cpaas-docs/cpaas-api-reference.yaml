  /api/whatsapp/blocked-members:
    get:
      tags:
      - WhatsApp User Management
      operationId: listBlockedUsers
      summary: List blocked users
      description: Returns a paginated list of users blocked for a WhatsApp 
        sender.
      parameters:
      - name: sender_id
        in: query
        required: true
        description: WhatsApp Business (WABA) number.
        schema:
          type: string
        example: 91XXXXXXXXXX
      - name: per_page
        in: query
        required: false
        description: Records per page (maximum 100). Default 10.
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 50
      - name: page
        in: query
        required: false
        description: Page number. Default 1.
        schema:
          type: integer
          minimum: 1
        example: 1
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUsersResponse'
              example:
                status: success
                data:
                  total: 250
                  per_page: 10
                  current_page: 1
                  blocked_members:
                  - phone: 91XXXXXXXXXX
                    blocked_at: '2026-03-26 10:15:32'
                  - phone: 91XXXXXXXXXX
                    blocked_at: '2026-03-25 08:30:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - WhatsApp User Management
      operationId: blockUsers
      summary: Block users
      description: Blocks a user from receiving messages from your WABA number. 
        The user must have interacted with your system within the last 24 hours 
        (for example via a campaign, API message or chatbot), otherwise the 
        request fails with a re-engagement check error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedMembersRequest'
            example:
              sender_id: 91XXXXXXXXXX
              phone: 91XXXXXXXXXX
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockUserResponse'
              example:
                status: success
                message: User blocked successfully.
                data:
                  phone: 91XXXXXXXXXX
                  blocked_at: '2026-03-26 10:15:32'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - WhatsApp User Management
      operationId: unblockUsers
      summary: Unblock users
      description: Removes the block on a user so they can receive messages 
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedMembersRequest'
            example:
              sender_id: 91XXXXXXXXXX
              phone: 91XXXXXXXXXX
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnblockUserResponse'
              example:
                status: success
                message: User unblocked successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
