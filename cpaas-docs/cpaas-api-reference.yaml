              - 'null'
            delivered_at:
              type:
              - string
              - 'null'
            opened_at:
              type:
              - string
              - 'null'
            clicked_at:
              type:
              - string
              - 'null'
            bounced_at:
              type:
              - string
              - 'null'
            failed_at:
              type:
              - string
              - 'null'
            unsubscribed_at:
              type:
              - string
              - 'null'
            complained_at:
              type:
              - string
              - 'null'
          description: ISO 8601 timestamps; `null` for events that have not 
            happened.
        recipient:
          type: string
        subject:
          type: string
        details:
          type: object
          properties:
