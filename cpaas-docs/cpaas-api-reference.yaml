  /api/rcs/send:
    post:
      tags:
      - RCS Messaging
      operationId: sendRcsMessage
      summary: Send an RCS message
      description: 'Sends an approved RCS message over the **Vi** (Vodafone Idea)
        or **Jio** network in India. Choose the format with `message_type` (`text_message`,
        `rich_card` or `carousel`); the `content` structure must match.


        Jio supports extra button types (`calendar_event`, `share_location`, `view_location_query`,
        `view_location_latlong`). Jio-only button types cannot be used on Vi. Templates
        must be approved, and media URLs must be direct, publicly accessible HTTPS
        links.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RcsSendRequest'
            examples:
              viText:
                summary: 'Vi: text with buttons'
                value:
                  botId: YOUR_VI_BOT_ID
                  to: 91XXXXXXXXXX
                  message_type: text_message
                  content:
                    textMessageContent: Hello John, your order ORD-9876 is ready
                      for pickup!
                    suggestions:
                    - suggestionType: reply
                      displayText: Confirm Pickup
                      postback: confirm_pickup
                    - suggestionType: url_action
                      displayText: Track Order
                      url: https://tracking.example.com/ORD-9876
                      postback: track_order
                    - suggestionType: dialer_action
                      displayText: Call Support
                      phoneNumber: +91XXXXXXXXXX
                      postback: call_support
              viRichCard:
                summary: 'Vi: rich card'
                value:
                  botId: YOUR_VI_BOT_ID
                  to: 91XXXXXXXXXX
                  message_type: rich_card
                  content:
                    orientation: VERTICAL
                    height: MEDIUM_HEIGHT
                    standAlone:
                      cardTitle: Festive Offer
                      cardDescription: Flat 20% off this week.
                      mediaUrl: https://cdn.example.com/sale_banner.jpg
                      suggestions:
                      - suggestionType: url_action
                        displayText: Shop Now
                        url: https://example.com/shop
                        postback: shop_now
                      - suggestionType: reply
                        displayText: Opt Out
                        postback: opt_out
              jioText:
                summary: 'Jio: text with extended buttons'
                value:
                  botId: YOUR_JIO_BOT_ID
                  to: 91XXXXXXXXXX
                  message_type: text_message
                  content:
                    textMessageContent: Your appointment is confirmed for March 
                      30, 2026 at 10:00 AM.
                    suggestions:
                    - suggestionType: calendar_event
                      displayText: Add to Calendar
                      postback: add_calendar
                    - suggestionType: view_location_latlong
                      displayText: View Location
                      postback: view_location
                    - suggestionType: reply
                      displayText: Confirm
                      postback: confirm_appt
                    - suggestionType: reply
                      displayText: Cancel
                      postback: cancel_appt
              jioCarousel:
                summary: 'Jio: carousel'
                value:
                  botId: YOUR_JIO_BOT_ID
                  to: 91XXXXXXXXXX
                  message_type: carousel
                  content:
                    width: MEDIUM_WIDTH
                    height: MEDIUM_HEIGHT
                    carouselList:
                    - cardTitle: Wireless Headphones
                      cardDescription: 40hr battery, noise cancellation.
                      mediaUrl: https://cdn.example.com/headphones.jpg
                      suggestions:
                      - suggestionType: url_action
                        displayText: Buy Now
                        url: https://example.com/product/1
                        postback: buy_1
                    - cardTitle: Smart Watch
                      cardDescription: Track fitness and stay connected.
                      mediaUrl: https://cdn.example.com/watch.jpg
                      suggestions:
                      - suggestionType: url_action
                        displayText: Buy Now
                        url: https://example.com/product/2
                        postback: buy_2
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcsSendResponse'
              example:
                status: success
                message: RCS message sent successfully.
                data:
                  message_id: rcs-vi-msg-lnbg0tyrvn
                  to: 91XXXXXXXXXX
                  status: submitted
                  received_at: '2026-03-26 10:15:32'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
