  /flow-api/webhook/trigger/{flow_id}:
    post:
      tags:
      - Flow Builder
      operationId: triggerFlow
      summary: Trigger a Flow Builder journey
      description: 'Triggers a published and active Flow Builder journey for a recipient.
        The flow then runs all configured steps (messages, conditions, delays).


        The endpoint is the flow''s webhook URL, shown in the portal under Flow Builder,
        then your flow, then Webhook URL. Send `phone` if the flow uses SMS or WhatsApp,
        `email` if it uses Email, plus the variables (`var1`, `var2`, ...) your flow
        expects.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Contact mobile number.
                  example: 91XXXXXXXXXX
                email:
                  type: string
                  format: email
                  description: Contact email address.
                  example: asha@example.com
              additionalProperties:
                type: string
                description: Flow variables (for example `var1`, `var2`) as 
                  configured in your flow.
            example:
              phone: 91XXXXXXXXXX
              email: asha@example.com
              var1: Asha
              var2: ORD-1001
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTriggerResponse'
              examples:
                ok:
                  summary: Triggered
                  value:
                    status: success
                    message: Flow jobs dispatched successfully
                notFound:
                  summary: Flow not found
                  value:
                    status: error
                    message: Flow not found.
                badJson:
                  summary: Invalid body
                  value:
                    status: error
                    message: Invalid JSON format. Please check your request 
                      body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: flow_id
        in: path
        required: true
        description: ID of the published flow, from its webhook URL.
        schema:
          type: string
