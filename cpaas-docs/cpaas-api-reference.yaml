  /api/verify/send-otp:
    post:
      tags:
      - Email Verification
      operationId: sendEmailOtp
      summary: Generate and send an OTP
      description: 'Generates a time-limited OTP and delivers it using the verification
        template configured in the portal (Templates, then OTP Templates). Store the
        `unique_id` from the response: it is required to validate the OTP.'
      parameters:
      - name: verification_id
        in: query
        required: true
        description: Verification ID fetched from the verification template in 
          the CPaaS+ portal.
        schema:
          type: string
      - name: type
        in: query
        required: true
        description: Delivery channel for the OTP.
        schema:
          type: string
          enum:
          - email
      - name: email
        in: query
        required: true
        description: Destination email address.
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
              example:
                status: success
                message: OTP sent successfully.
                data:
                  unique_id: otp-sess-hpzv07gryhdr
                  expires_in: 300
                  channel: email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/verify/validate-otp:
    post:
      tags:
      - Email Verification
      operationId: validateEmailOtp
      summary: Validate an OTP
      description: 'Validates the OTP entered by the user against the `unique_id`
        returned by the send call. Returns `verified: true` on success. A wrong or
        expired OTP returns `status: error` with `verified: false`.'
      parameters:
      - name: unique_id
        in: query
        required: true
        description: Unique ID returned in the response of the send-OTP request.
        schema:
          type: string
      - name: otp
        in: query
        required: true
        description: OTP value entered by the user.
        schema:
          type: string
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpValidateResponse'
              examples:
                verified:
                  summary: OTP verified
                  value:
                    status: success
                    message: OTP verified successfully.
                    data:
                      verified: true
                      unique_id: otp-sess-hpzv07gryhdr
                wrongOtp:
                  summary: Wrong OTP
                  value:
                    status: error
                    message: Invalid OTP.
                    data:
                      verified: false
                expired:
                  summary: Expired OTP
                  value:
                    status: error
                    message: OTP has expired. Please request a new OTP.
                    data:
                      verified: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/rcs/template/create:
    post:
      tags:
      - RCS Templates
      operationId: createRcsTemplate
      summary: Create an RCS template
      description: 'Creates an RCS template. Set `type` to choose the format:


        - `text_message`: text with up to 11 suggestion buttons

        - `rich_card`: a single card with media, title, description and up to 4 buttons

        - `carousel`: 2 to 10 cards, each with up to 4 buttons



        Templates are reviewed before use. The response returns `approval_status`
        (`pending`, `approved` or `rejected`); send only after approval.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/RcsTemplateText'
              - $ref: '#/components/schemas/RcsTemplateRichCard'
              - $ref: '#/components/schemas/RcsTemplateCarousel'
              discriminator:
                propertyName: type
                mapping:
                  text_message: '#/components/schemas/RcsTemplateText'
                  rich_card: '#/components/schemas/RcsTemplateRichCard'
                  carousel: '#/components/schemas/RcsTemplateCarousel'
            examples:
              textWithButtons:
                summary: Plain text + buttons
                value:
                  name: order_ready
                  agent_id: your-agent-id
                  type: text_message
                  textMessageContent: Hello {{name}}, your order {{order_id}} is
                    ready for pickup!
                  suggestions:
                  - suggestionType: reply
                    displayText: Opt out
                    postback: opt_out
                  - suggestionType: url_action
                    displayText: View Details
                    url: https://example.com/order/{{order_id}}
                    postback: view_details
                  - suggestionType: dialer_action
                    displayText: Call Support
                    phoneNumber: +91XXXXXXXXXX
                    postback: call_support
              richCard:
                summary: Media + buttons
                value:
                  name: promo_card
                  agent_id: your-agent-id
                  type: rich_card
                  orientation: VERTICAL
                  height: SHORT_HEIGHT
                  standAlone:
                    cardTitle: Festive Offer
                    cardDescription: Flat 20% off on all orders this week.
                    mediaUrl: https://example.com/media/offer.jpg
                    suggestions:
                    - suggestionType: url_action
                      displayText: Shop Now
                      url: https://example.com/shop
                      postback: shop_now
              carousel:
                summary: Carousel
                value:
                  name: catalogue_carousel
                  agent_id: your-agent-id
                  type: carousel
                  width: MEDIUM_WIDTH
