components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token issued for your account. Send as `Authorization: Bearer
        <token>`.'
  responses:
    BadRequest:
      description: 'Bad request: invalid JSON or missing fields.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Forbidden: the request came from a restricted (non-allow-listed)
        IP address.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 'Unprocessable entity: invalid numbers or fields, or invalid message
        content.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: 'Internal server error: a server-side issue. Retry later or contact
        support.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SmsTemplateSendRequest:
      type: object
      required:
      - alias
      - to
      properties:
        alias:
          type: string
          description: Template ID (alias) from the CPaaS+ web portal.
        to:
          type: array
          maxItems: 50
          items:
            type: string
          description: Destination mobile numbers (up to 50).
        params:
          type: object
          additionalProperties:
            type: string
          description: 'Dynamic values keyed by variable position, as defined in the
            template (for example `{"1": "value"}`).'
    SmsOpenTextRequest:
      type: object
      required:
      - from
      - to
      - text
      properties:
        from:
          type: string
          description: Sender ID / source address / header as configured on the 
            platform.
        to:
          type: array
          items:
            type: string
          description: Destination mobile numbers. Up to 100 per request.
          maxItems: 100
        text:
          type: string
          description: Message text.
        type:
          type: string
          enum:
          - N
          - U
          - A
          default: N
          description: '`N` plain text (default), `U` Unicode, `A` auto-detect.'
        product:
          type: string
          enum:
          - Transactional
          - Promotional
          - OTP
          - Other
          description: Traffic category.
        template_id:
          type: string
          description: Registered template ID. Mandatory in India.
        entity_id:
          type: string
          description: Registered entity ID. Mandatory in India.
    WhatsAppMessageRequest:
      type: object
      required:
      - source
      - destination
      - template
      properties:
        source:
          type: string
          description: WhatsApp sender ID (WABA number).
        destination:
          type: string
          description: Recipient phone number.
        template:
          type: object
          required:
          - id
          properties:
            id:
              type: string
              description: Approved WhatsApp template ID.
            params:
              type: array
              items:
                type: string
              description: Values for the template body variables, in order.
        media_url:
          type: string
          format: uri
          description: Public URL of a document, PDF or image for templates with
            a media header.
    OrderStatusRequest:
      type: object
      properties:
        order_reference_id:
          type: string
          description: Order reference identifier from your system.
        status:
          type: string
          description: New order status.
          enum:
          - confirmed
          - shipped
          - delivered
          - cancelled
        status_notes:
          type: string
          description: Additional status notes for the customer.
      required:
      - order_reference_id
      - status
    RefundRequest:
      type: object
      properties:
        order_reference_id:
          type: string
          description: Order reference identifier for the refund.
        amount:
          type: number
          description: Amount to refund.
        speed:
          type: string
          description: Refund processing speed.
      required:
      - order_reference_id
      - amount
    BlockedMembersRequest:
      type: object
      properties:
        sender_id:
          type: string
          description: Your WhatsApp Business (WABA) number.
        phone:
          type: string
          description: Mobile number of the user.
      required:
      - sender_id
      - phone
    EmailAttachment:
      type: object
      required:
      - filename
      - type
      - content
      properties:
        filename:
          type: string
          description: File name including extension.
        type:
          type: string
          description: MIME type, for example `application/pdf`.
        content:
          type: string
          format: byte
          description: Base64-encoded file content.
    EmailTemplateRequest:
      type: object
      required:
      - service_name
      - template_name
      - from
      - from_name
      - to
      - subject
      properties:
        service_name:
          type: string
          description: Service name of the email configuration.
        template_name:
          type: string
          description: Name of the email template.
        from:
          type: string
          description: Sender address on your configured domain.
        from_name:
          type: string
          description: Display name for the sender.
        to:
          type: string
          format: email
          description: Destination email address.
        cc:
          type: array
          items:
            type: string
            format: email
        bcc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
          description: Subject line.
        params:
          type: array
          items:
            type: string
          description: Template variable values, in the order defined in the 
            template.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/EmailAttachment'
    EmailOpenTextRequest:
      type: object
      required:
      - account
      - from
      - from_name
      - to
      - subject
      - body
      properties:
        account:
          type: string
          description: Service name of the email configuration.
        from:
          type: string
          description: Sender address on your configured domain.
        from_name:
          type: string
          description: Display name for the sender.
        to:
          type: string
          format: email
          description: Destination email address.
        cc:
          type: array
          items:
            type: string
            format: email
        bcc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body:
          type: string
          description: Full HTML or plain-text content of the email body.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/EmailAttachment'
    RcsTemplateSuggestion:
      type: object
      required:
      - suggestionType
      - displayText
      properties:
        suggestionType:
          type: string
          enum:
          - reply
          - url_action
          - dialer_action
          description: '`reply` quick reply, `url_action` opens a URL, `dialer_action`
            opens the dialer.'
        displayText:
          type: string
          maxLength: 25
          description: Button label (max 25 characters).
        postback:
          type: string
          description: Optional callback value returned when the button is 
            tapped.
        url:
          type: string
          description: Target URL for `url_action`. Variables are allowed.
        phoneNumber:
          type: string
          description: Phone number for `dialer_action`.
    RcsTemplateCard:
      type: object
      properties:
        cardTitle:
          type: string
          maxLength: 200
        cardDescription:
          type: string
          maxLength: 2000
        mediaUrl:
          type: string
          format: uri
        suggestions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/RcsTemplateSuggestion'
    RcsTemplateText:
      type: object
      required:
      - name
      - agent_id
      - type
      - textMessageContent
      properties:
        name:
          type: string
          description: Template name.
        agent_id:
          type: string
          description: Your RCS agent ID.
        type:
          type: string
          const: text_message
        textMessageContent:
          type: string
          description: Message text. Define variables with double braces, for 
            example `{{name}}`.
        suggestions:
          type: array
          maxItems: 11
          items:
            $ref: '#/components/schemas/RcsTemplateSuggestion'
    RcsTemplateRichCard:
      type: object
      required:
      - name
      - agent_id
      - type
      - orientation
      - standAlone
      properties:
        name:
          type: string
        agent_id:
          type: string
        type:
          type: string
          const: rich_card
        orientation:
          type: string
          enum:
          - HORIZONTAL
          - VERTICAL
        height:
          type: string
          enum:
          - SHORT_HEIGHT
          - MEDIUM_HEIGHT
          - TALL_HEIGHT
          description: Card height. Applies when orientation is Vertical.
        standAlone:
          $ref: '#/components/schemas/RcsTemplateCard'
    RcsTemplateCarousel:
      type: object
      required:
      - name
      - agent_id
      - type
      - carouselList
      properties:
        name:
          type: string
        agent_id:
          type: string
        type:
          type: string
          const: carousel
        width:
          type: string
          enum:
          - SMALL_WIDTH
          - MEDIUM_WIDTH
        height:
          type: string
          enum:
          - SHORT_HEIGHT
          - MEDIUM_HEIGHT
        carouselList:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/RcsTemplateCard'
    RcsSuggestion:
      type: object
      required:
      - suggestionType
      - displayText
      description: 'A button attached to a message. Which extra fields apply depends
        on `suggestionType`:

        `url_action` (url, application), `dialer_action` (phoneNumber), `calendar_event`

        (title, startTime, endTime, timeZone, description), `view_location_query`
        (query),

        `view_location_latlong` (label, latitude, longitude). `reply` and `share_location`
        need only

        `displayText` and `postback`.

        '
      properties:
        suggestionType:
          type: string
          enum:
          - reply
          - url_action
          - dialer_action
          - share_location
          - calendar_event
          - view_location_query
          - view_location_latlong
        displayText:
          type: string
        postback:
          type: string
          description: Custom value returned when the button is tapped.
        url:
          type: string
        application:
          type: string
          description: Application used to open the URL, for example `BROWSER`.
        phoneNumber:
          type: string
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          description: Format `YYYY-MM-DD HH:MM:SS`.
        endTime:
          type: string
          description: Format `YYYY-MM-DD HH:MM:SS`.
        timeZone:
          type: string
          description: ISO 8601 with zone, for example 
            `2025-11-05T10:30:00[Asia/Kolkata]`.
        query:
          type: string
        label:
          type: string
        latitude:
          type: string
        longitude:
          type: string
    RcsCard:
      type: object
      properties:
        mediaUrl:
          type: string
          format: uri
        cardTitle:
          type: string
        cardDescription:
          type: string
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/RcsSuggestion'
    RcsContent:
      type: object
      description: 'Message content. The structure must match `message_type`: `text_message`
        uses `textMessageContent` and optional `suggestions` (max 11); `rich_card`
        uses `orientation`, `height` and `standAlone` (max 4 buttons); `carousel`
        uses `width`, `height` and `carouselList` (2 to 10 cards, max 4 buttons each).'
      properties:
        textMessageContent:
          type: string
        height:
          type: string
          description: '`SHORT_HEIGHT`, `MEDIUM_HEIGHT` or `TALL_HEIGHT` (rich card);
            `SHORT_HEIGHT` or `MEDIUM_HEIGHT` (carousel).'
        width:
          type: string
          description: '`SMALL_WIDTH` or `MEDIUM_WIDTH` (carousel).'
        alignment:
          type: string
          enum:
          - LEFT
          - RIGHT
        orientation:
          type: string
          enum:
          - HORIZONTAL
          - VERTICAL
        standAlone:
          $ref: '#/components/schemas/RcsCard'
        carouselList:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/RcsCard'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/RcsSuggestion'
    RcsSendRequest:
      type: object
      properties:
        botId:
          type: string
          description: RCS bot / agent ID registered on the operator network 
            (from the portal under RCS, then Agents).
        to:
          type: string
          description: Destination mobile number.
        message_type:
          type: string
          description: Type of message.
          enum:
          - text_message
          - rich_card
          - carousel
        content:
          $ref: '#/components/schemas/RcsContent'
      required:
      - botId
      - to
      - message_type
      - content
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          description: '`error` on platform errors.'
        error_code:
          type: integer
          description: HTTP-style error code.
        error_message:
          type: string
          description: Human-readable error.
        message:
          type: string
          description: Human-readable error (validation style).
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-level validation errors keyed by field name.
      description: 'Error body. The exact fields present depend on the failure: validation
        failures return `message` and `errors`; platform failures return `status`,
        `error_code` and `error_message`.'
    Pagination:
      type: object
      properties:
        total:
          type: integer
        count:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        total_pages:
          type: integer
    SmsSubmitResult:
      type: object
      properties:
        status:
          type: string
          description: '`submitted` or `failed` for this recipient.'
          enum:
          - submitted
          - failed
        message_id:
          type:
          - string
          - 'null'
          description: Unique message ID. `null` when the entry failed. Use it 
            with the status endpoint.
        number:
          type: string
          description: Destination number for this entry.
        units:
          type: integer
          description: SMS units consumed. One unit is 160 characters of plain 
            text or 70 characters of Unicode.
        error:
          type: string
          description: Reason, present when `status` is `failed` (for example 
            `Invalid phone number`).
        received_at:
          type: string
          description: Timestamp the platform received the request (`YYYY-MM-DD 
            HH:MM:SS`).
    SmsSendResponse:
      type: object
      properties:
        status:
          type: string
          description: Overall submission status.
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/SmsSubmitResult'
      description: 'Per-recipient results. The API supports partial success: an HTTP
        200 can contain both submitted and failed entries, so always inspect each
        entry in `data`.'
    SmsCampaignResponse:
      type: object
      properties:
        status:
          type: string
          description: '`success` means the message was submitted, not delivered.'
        ref_id:
          type: string
          description: Unique identifier (message ID) of the request.
    SmsStatusResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              message_id:
                type: string
              from:
                type: string
              number:
                type: string
              status:
                type: string
                description: Delivery status, for example `DELIVRD` or `FAILED`.
              code:
                type: string
                description: Delivery code captured from the operator.
              units:
                type: integer
              received_at:
                type: string
              submitted_at:
                type: string
              dlr_received_at:
                type:
                - string
                - 'null'
                description: Delivery-report timestamp, or null if not yet 
                  received.
        pagination:
          $ref: '#/components/schemas/Pagination'
    WhatsAppMessageResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            message_id:
              type: string
              description: WhatsApp message ID returned by Meta (`wamid...`).
            receiver:
              type: string
              description: Destination WhatsApp number.
            status:
              type: string
              description: Delivery pipeline status.
              enum:
              - submitted
              - failed
    OrderStatusResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            order_id:
              type: string
            updated_status:
              type: string
            notified_at:
              type: string
              description: Time the customer was notified (`YYYY-MM-DD 
                HH:MM:SS`).
    RefundResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            refund_id:
              type: string
              description: Unique refund transaction ID.
            order_id:
              type: string
            refund_amount:
              type: string
            currency:
              type: string
            refund_status:
              type: string
              description: Refund transaction status.
              enum:
              - processing
              - completed
              - failed
    BlockUserResponse:
      type: object
      properties:
