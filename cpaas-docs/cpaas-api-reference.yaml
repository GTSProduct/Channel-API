openapi: 3.1.0
info:
  title: CPaaS+ Messaging API
  version: 1.0.0
  description: 'Unified REST API for sending and managing customer communications
    across **SMS**, **WhatsApp**, **Email (including OTP verification)**, **RCS**
    and **Flow Builder**. It also includes the **WhatsApp Wrapper API**, a simplified
    layer over Meta''s WhatsApp Cloud API for sending free-form message types (text,
    media, interactive and more).


    All APIs are HTTP-based, use JSON and are secured with bearer-token authentication.
    Generate a token in the CPaaS+ portal (API tab, then **Add new Token**) and send
    it as `Authorization: Bearer <token>` on every request.


    A `200` response means the request was **accepted**, not that the message was
    delivered. Use the status endpoints for delivery results.'
servers:
- url: '{baseUrl}'
  description: Your CPaaS+ API host (provided at onboarding)
  variables:
    baseUrl:
      default: https://api.yourcpaas.com
      description: Host of your CPaaS+ web portal account, without a trailing 
        slash.
security:
- bearerAuth: []
tags:
- name: SMS
  description: Send SMS using portal campaigns, approved templates, or open 
    text, and check delivery status.
- name: WhatsApp Messaging
  description: Send WhatsApp template messages and manage order status and 
    refunds.
- name: WhatsApp Wrapper API
  description: Send text, media, contact, location, interactive and other 
    WhatsApp message types through the single Wrapper endpoint.
- name: WhatsApp User Management
  description: Block, unblock, bulk-import and sync blocked WhatsApp users for a
    WABA number.
- name: Email
  description: Send template-based or open-text email and check delivery status.
- name: Email Verification
  description: Generate and validate one-time passwords (OTP) delivered by 
    email.
- name: RCS Templates
  description: Create RCS templates (text with buttons, rich card, carousel).
- name: RCS Messaging
  description: Send RCS messages and check message status.
- name: Flow Builder
  description: Create, manage, publish and trigger Flow Builder journeys.
paths:
  /api/sms/send-msg:
    post:
      tags:
      - SMS
      operationId: sendSmsCampaign
      summary: Send SMS using a campaign
      description: 'Sends a single SMS using a campaign created in the web portal.
        Provide the destination number and the dynamic values. No request body is
        needed. Send `Content-Type: text/plain`.


        A `success` status means the message was submitted, not delivered.'
      parameters:
      - name: campaign_id
        in: query
        required: true
        description: Campaign ID generated in the web portal under 
          **Campaigns**.
        schema:
          type: string
        example: '1234'
      - name: phone
        in: query
        required: true
        description: Destination mobile number the message will be delivered to.
        schema:
          type: string
        example: 91XXXXXXXXXX
      - name: params
        in: query
        required: true
        description: JSON array (URL-encoded) of the dynamic values defined in 
          the campaign template, in order. A count mismatch returns an error.
        schema:
          type: string
        example: '["Asha","ORD-1001","25 Dec"]'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsCampaignResponse'
              example:
                status: success
                ref_id: 26f5b436-7377-4574-9173-c07e81b164d5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sms/template/send:
    post:
      tags:
      - SMS
      operationId: sendSmsTemplate
      summary: Send SMS using a template
      description: Sends an SMS based on a template (alias) created in the 
        CPaaS+ web portal. Up to 50 recipients per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsTemplateSendRequest'
            example:
              alias: TPL_ORDER_CONFIRM
              to:
              - 91XXXXXXXXXX
              params:
                '1': ORD-1001
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
              example:
                status: success
                message: Messages are sent successfully.
                data:
                - status: submitted
                  message_id: d0056007-2e32-44fa-beb7-1dbdfb0d8bc2
                  number: 91XXXXXXXXXX
                  units: 1
                  received_at: '2026-03-25 20:13:54'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sms/send:
    post:
      tags:
      - SMS
      operationId: sendSmsOpenText
      summary: Send SMS with open text
      description: Sends an SMS with free-form text to up to 100 numbers. In 
        India, `template_id` and `entity_id` (DLT) are mandatory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsOpenTextRequest'
            example:
              from: CPAAS
              to:
              - 91XXXXXXXXXX
              text: Your order ORD-1001 has been shipped.
              type: N
              product: Transactional
              template_id: '1107160000000000000'
              entity_id: '1101160000000000000'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
              example:
                status: success
                message: Messages are sent successfully.
                data:
                - status: submitted
                  message_id: ce73930a-687b-49f5-a4c8-80e816b9b458
                  number: 91XXXXXXXXXX
                  units: 1
                  received_at: '2026-03-26 19:41:10'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sms/json:
    post:
      tags:
      - SMS
      operationId: sendSmsBulk
      summary: Send bulk SMS
      description: 'Sends the same message to many numbers, or personalised messages
        to different numbers, in one call using the `data` array (maximum 500 entries).
        Entries that omit `from`, `text` or `to` use the `root` values.


        The API supports **partial success**: some entries may succeed while others
        fail in the same call. Check each entry in `data`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsBulkRequest'
            example:
              root:
                from: CPAAS
                text: Hello, your order is confirmed.
                to:
                - 91XXXXXXXXXX
              data:
              - from: PROMO
                text: Hi John, your OTP is 485923
                to:
                - 91XXXXXXXXXX
              - from: PROMO
                text: Hi Priya, your OTP is 736104
                to:
                - 91XXXXXXXXXX
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
              example:
                status: success
                message: Messages are sent successfully.
                data:
                - status: submitted
                  message_id: d01c11ce-755e-4d03-900f-e185bf87bbe9
                  number: 91XXXXXXXXXX
                  units: 1
                  received_at: '2026-03-26 10:15:32'
                - status: failed
                  message_id:
                  number: '9199'
                  units: 0
                  error: Invalid phone number
                  received_at: '2026-03-26 10:15:32'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sms/status:
    get:
      tags:
      - SMS
      operationId: getSmsStatus
      summary: Get SMS status
      description: Retrieves delivery reports (DLR). All filters are optional 
        and can be combined. Results are paginated (default and maximum 100 per 
        page).
      parameters:
      - name: number
        in: query
        required: false
        description: Filter by destination mobile number.
        schema:
          type: string
      - name: id
        in: query
        required: false
        description: Filter by message ID.
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Filter by sender / header.
        schema:
          type: string
      - name: code
        in: query
        required: false
        description: Filter by the delivery code captured from the operator.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter by message status.
        schema:
          type: string
          enum:
          - DELIVRD
          - FAILED
      - name: page
        in: query
        required: false
        description: Page number.
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: Records per page. Maximum 100; can be limited to 50, 25 or 
          10.
        schema:
          type: integer
          maximum: 100
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsStatusResponse'
              example:
                status: success
                data:
                - message_id: 5f3747eb-f92e-4b1a-97bf-72b8e00b75e9
                  from: SENDER
                  number: 91XXXXXXXXXX
                  status: FAILED
                  code: '105'
                  units: 1
                  received_at: '2025-09-30 04:34:14'
                  submitted_at: '2025-09-30 04:34:14'
                  dlr_received_at:
                pagination:
                  total: 1
                  count: 1
                  per_page: 100
                  current_page: 1
                  total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/whatsapp/msg:
    post:
      tags:
      - WhatsApp Messaging
      operationId: sendWhatsAppMessage
      summary: Send a WhatsApp template message
      description: 'Sends an approved WhatsApp template message. Templates must be
        approved in Meta Business Manager before sending. Include `media_url` for
        templates with an image, video or document header.


        If the template has dynamic variables, pass the required `template.params`
        even when sending with media.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppMessageRequest'
            examples:
              withoutMedia:
                summary: Template with variables
                value:
                  source: 91XXXXXXXXXX
                  destination: 91XXXXXXXXXX
                  template:
                    id: order_update
                    params:
                    - Asha
                    - ORD-1001
              withMedia:
                summary: Template with a media header
                value:
                  source: 91XXXXXXXXXX
                  destination: 91XXXXXXXXXX
                  template:
                    id: invoice_share
                  media_url: https://example.com/files/invoice.pdf
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessageResponse'
              example:
                status: success
                message: Message sent successfully.
                data:
                  message_id: wamid.RpbCVV2HEWfRuwiXDz5EqRRLmTy0laGmDSIH
                  receiver: 91XXXXXXXXXX
                  status: submitted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/whatsapp/{senderHash}/messages:
    post:
      tags:
      - WhatsApp Wrapper API
      summary: Send a WhatsApp message
      operationId: sendWhatsAppCloudMessage
      servers:
      - url: https://testqa.cpaas.globeteleservices.com
        description: Sandbox environment
      description: 'Sends a supported WhatsApp message using the specified Sender
        Hash.


        This single endpoint supports 15 request formats. Select the relevant named
        request example in the API playground to load a sample payload, then replace
        the sample recipient, media IDs and message details with your own values.


        The recipient number must be in international format without

        the leading plus sign.


        Free-form messages are subject to Meta''s 24-hour customer-service

        window. Outside this window, an approved template message is

        required to reopen the conversation.


        A successful response means the request was accepted for delivery.

        It does not guarantee that the recipient received the message.


        Media messages require a media ID obtained through the Media

        Upload API before the message is sent.

        '
      parameters:
      - name: senderHash
        in: path
        required: true
        description: 'Sender Hash from CPaaS+ Portal > Account > Numbers >

          WhatsApp channel.

          '
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - title: Text Message
                type: object
                required:
                - messaging_product
                - to
                - type
                - text
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                    default: individual
                  to:
                    type: string
                    description: Recipient phone number without a leading plus 
                      sign.
                  type:
                    type: string
                    enum:
                    - text
                  text:
                    type: object
                    required:
                    - body
                    properties:
                      body:
                        type: string
                        maxLength: 4096
                        description: Text content of the message.
                      preview_url:
                        type: boolean
                        description: Controls URL preview in the text message.
              - title: Audio Message
                type: object
                required:
                - messaging_product
                - to
                - type
                - audio
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - audio
                  audio:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        description: Media ID obtained through media upload.
              - title: Image Message
                type: object
                required:
                - messaging_product
                - to
                - type
                - image
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - image
                  image:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        description: Media ID obtained through media upload.
                      caption:
                        type: string
                        description: Optional image caption.
              - title: Video Message
                type: object
                required:
                - messaging_product
                - to
                - type
                - video
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - video
                  video:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        description: Media ID obtained through media upload.
                      caption:
                        type: string
                        description: Optional video caption.
              - title: Document Message
                type: object
                required:
                - messaging_product
                - to
                - type
                - document
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - document
                  document:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        description: Media ID obtained through media upload.
                      caption:
                        type: string
                        description: Optional document caption.
                      filename:
                        type: string
                        description: Optional document filename.
              - title: Sticker Message
                type: object
                required:
                - messaging_product
                - to
                - type
                - sticker
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - sticker
                  sticker:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        description: Media ID for a WebP sticker.
              - title: Contacts Message
                type: object
                required:
                - messaging_product
                - to
                - type
                - contacts
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - contacts
                  contacts:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: object
                          required:
                          - formatted_name
                          properties:
                            formatted_name:
                              type: string
                            first_name:
                              type: string
                            last_name:
                              type: string
                            middle_name:
                              type: string
                            suffix:
                              type: string
                            prefix:
                              type: string
                        phones:
                          type: array
                          items:
                            type: object
                            properties:
                              phone:
                                type: string
                              type:
                                type: string
                              wa_id:
                                type: string
                        emails:
                          type: array
                          items:
                            type: object
                            properties:
                              email:
                                type: string
                              type:
                                type: string
                        addresses:
                          type: array
                          items:
                            type: object
                            properties:
                              street:
                                type: string
                              city:
                                type: string
                              state:
                                type: string
                              zip:
                                type: string
                              country:
                                type: string
                              country_code:
                                type: string
                              type:
                                type: string
                        org:
                          type: object
                          properties:
                            company:
                              type: string
                            department:
                              type: string
                            title:
                              type: string
                        urls:
                          type: array
                          items:
                            type: object
                            properties:
                              url:
                                type: string
                              type:
                                type: string
              - title: Location Message
                type: object
                required:
                - messaging_product
                - to
                - type
                - location
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - location
                  location:
                    type: object
                    required:
                    - latitude
                    - longitude
                    properties:
                      latitude:
                        type: number
                      longitude:
                        type: number
                      name:
                        type: string
                      address:
                        type: string
              - title: Location Request
                type: object
                required:
                - messaging_product
                - to
                - type
                - interactive
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - interactive
                  interactive:
                    type: object
                    required:
                    - type
                    - body
                    - action
                    properties:
                      type:
                        type: string
                        enum:
                        - location_request_message
                      body:
                        type: object
                        required:
                        - text
                        properties:
                          text:
                            type: string
                      action:
                        type: object
                        required:
                        - name
                        properties:
                          name:
                            type: string
                            enum:
                            - send_location
              - title: Interactive CTA URL
                type: object
                required:
                - messaging_product
                - to
                - type
                - interactive
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - interactive
                  interactive:
                    type: object
                    required:
                    - type
                    - body
                    - action
                    properties:
                      type:
                        type: string
                        enum:
                        - cta_url
                      header:
                        type: object
                        description: Optional message header.
                        properties:
                          type:
                            type: string
                          text:
                            type: string
                      body:
                        type: object
                        required:
                        - text
                        properties:
                          text:
                            type: string
                      footer:
                        type: object
                        properties:
                          text:
                            type: string
                      action:
                        type: object
                        required:
                        - parameters
                        properties:
                          parameters:
                            type: object
                            required:
                            - display_text
                            - url
                            properties:
                              display_text:
                                type: string
                              url:
                                type: string
              - title: Interactive List
                type: object
                required:
                - messaging_product
                - to
                - type
                - interactive
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - interactive
                  interactive:
                    type: object
                    required:
                    - type
                    - body
                    - action
                    properties:
                      type:
                        type: string
                        enum:
                        - list
                      header:
                        type: object
                        properties:
                          type:
                            type: string
                          text:
                            type: string
                      body:
                        type: object
                        required:
                        - text
                        properties:
                          text:
                            type: string
                      footer:
                        type: object
                        properties:
                          text:
                            type: string
                      action:
                        type: object
                        required:
                        - button
                        - sections
                        properties:
                          button:
                            type: string
                          sections:
                            type: array
                            items:
                              type: object
                              properties:
                                title:
                                  type: string
                                rows:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                    - id
                                    - title
                                    properties:
                                      id:
                                        type: string
                                      title:
                                        type: string
                                      description:
                                        type: string
              - title: Interactive Buttons
                type: object
                required:
                - messaging_product
                - to
                - type
                - interactive
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
                    type: string
                  type:
                    type: string
                    enum:
                    - interactive
                  interactive:
                    type: object
                    required:
                    - type
                    - body
                    - action
                    properties:
                      type:
                        type: string
                        enum:
                        - button
                      header:
                        type: object
                        properties:
                          type:
                            type: string
                          text:
                            type: string
                      body:
                        type: object
                        required:
                        - text
                        properties:
                          text:
                            type: string
                      footer:
                        type: object
                        properties:
                          text:
                            type: string
                      action:
                        type: object
                        required:
                        - buttons
                        properties:
                          buttons:
                            type: array
                            maxItems: 3
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - reply
                                reply:
                                  type: object
                                  required:
                                  - id
                                  - title
                                  properties:
                                    id:
                                      type: string
                                    title:
                                      type: string
              - title: Reaction
                type: object
                required:
                - messaging_product
                - to
                - type
                - reaction
                properties:
                  messaging_product:
                    type: string
                    enum:
                    - whatsapp
                  recipient_type:
                    type: string
                    enum:
                    - individual
                  to:
