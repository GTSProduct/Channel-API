              type: string
    RcsStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            message_id:
              type: string
            status:
              type: string
              description: Current delivery status, for example `submitted`, 
                `delivered`, `read` or `failed`.
            status_description:
              type: string
            message_type:
              type: string
            priority:
              type:
              - string
              - 'null'
            direction:
              type: string
            number:
              type: string
            created_at:
              type:
              - string
              - 'null'
            scheduled_at:
              type:
              - string
              - 'null'
            sent_at:
              type:
              - string
              - 'null'
            delivered_at:
              type:
              - string
              - 'null'
            failed_at:
              type:
              - string
              - 'null'
            cancelled_at:
              type:
              - string
              - 'null'
            updated_at:
              type:
              - string
              - 'null'
    FlowTriggerResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    SmsBulkRequest:
      type: object
      properties:
        root:
          type: object
          properties:
            from:
              type: string
              description: Default sender ID / header, used when an entry omits 
                `from`.
            text:
              type: string
              description: Default message text, used when an entry omits 
                `text`.
            to:
              type: array
              items:
                type: string
              description: Default destination number(s), used when an entry 
                omits `to`.
          required:
          - from
          - text
          - to
          description: Fallback values applied to any `data[]` entry that omits 
            `from`, `text` or `to`.
        data:
          type: array
          maxItems: 500
          description: Individual messages. Maximum 500 per request.
          items:
            type: object
            properties:
              from:
                type: string
                description: Sender for this message. Overrides `root.from`.
              text:
                type: string
                description: Text for this message. Overrides `root.text`.
              to:
                type: array
                items:
                  type: string
                description: Destination number(s) for this entry. Overrides 
                  `root.to`.
      required:
      - root
      - data
