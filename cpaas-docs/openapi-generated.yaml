        ## 1\. API Overview


        | Parameter | Details |

        | --- | --- |

        | API Name | File Upload User Block |

        | Method | POST |

        | Endpoint | `/api/whatsapp/blocked-members/import-csv` |

        | Full URL | `{{baseurl}}/api/whatsapp/blocked-members/import-csv` |

        | Description | Block multiple users at once by uploading a CSV file
        containing their mobile numbers. |


        ## 2\. Headers


        | Key | Value |

        | --- | --- |

        | Accept | `application/json` |

        | Authorization | `Bearer {{Bearer Token}}` |


        ## 3\. Request Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `sender_id` | Text | Yes | Your WABA number. |

        | `file` | File | Yes | CSV file containing mobile numbers to block. One
        number per row. |


        ## 4\. Success Response


        ``` json

        {
          "status": "success",
          "message": "CSV imported successfully.",
          "data": {
            "total": 250,
            "blocked": 248,
            "failed": 2
          }
        }

         ```

        ## 5\. Response Parameters


        | Parameter | Description |

        | --- | --- |

        | `status` | Indicates success. |

        | `message` | CSV imported successfully. |

        | `data.total` | Number of records found in the uploaded CSV. |

        | `data.blocked` | Number of users successfully blocked. |

        | `data.failed` | Number of entries that failed, such as invalid formats
        or duplicates. |
  /whatsapp/blocked-members/sync:
    post:
      summary: Sync Blocked Users
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses: {}
      tags:
        - WhatsApp
        - User Management
      security:
        - BearerAuth: []
      description: >-
        | Field | Details |

        | --- | --- |

        | API Name | Sync Blocked Users |

        | Method | `POST` |

        | Endpoint | `{{Base URL}}/api/whatsapp/blocked-members/sync` |

        | Description | Synchronise the blocked users list stored in CPaaS+ with
        the WhatsApp Business Platform. Use this after bulk imports or manual
        changes to ensure the block list is consistent across systems. |

        | `sender_id` | Required: Yes |

        | `sender_id` Description | Your official WhatsApp Business Account
        number |

        | `Accept` | `application/json` |

        | `Content-Type` | `application/json` |

        | `Authorization` | `Bearer {{Bearer Token}}` |


        ### Request


        Bash


        ``` bash

        curl --location
        'https://api.yourcpaas.com/api/whatsapp/blocked-members/sync' \

        --header 'Accept: application/json' \

        --header 'Content-Type: application/json' \

        --header 'Authorization: Bearer {{Bearer Token}}' \

        --data '{
          "sender_id": "Your WhatsApp Business Account Number"
        }'

         ```

        ### Success Response


        JSON


        ``` json

        {
          "status": "success",
          "message": "Blocked users synced successfully.",
          "data": {
            "synced": 250,
            "synced_at": "2026-03-26 10:15:32"
          }
        }

         ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sender_id:
                  type: string
            example:
              sender_id: '{{WABA Number}}'
  /api/whatsapp/msg:
    post:
