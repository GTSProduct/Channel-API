openapi: 3.0.0
info:
  title: CPAAS Copy 2
  version: 1.0.0
  description: ''
servers:
  - url: '{{BaseURL}}'
  - url: '{{baseurl}}api'
  - url: '{{baseurl}}'
  - url: '{{Base URL}}'
paths:
  /api/sms/send-msg:
    post:
      summary: Campaign
      parameters:
        - name: campaign_id
          in: query
          description: >-
            The Campaign ID is generated through the Web Portal under
            'Campaigns'
          schema:
            type: string
          example: '{{Campaign ID}}'
        - name: phone
          in: query
          description: >-
            The Destination Mobile Number to which the message will be
            terminated
          schema:
            type: string
          example: '{{Mobile Number}}'
        - name: params
          in: query
          description: The Number of Dynamic values to be passed as defined in the template
          schema:
            type: string
          example: '["{{Var1}}","{{Var2}}","{{Var3}}"]'
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{Token}}
      responses: {}
      tags:
        - SMS
      security:
        - BearerAuth: []
      description: >-
        | Detail | Description |

        | --- | --- |

        | API Purpose | Sends a pre-built portal campaign to a mobile number. |

        | Endpoint | `{{BaseURL}}/api/sms/send-msg` |

        | Campaign ID (`campaign_id`) | The Campaign ID is generated in the Web
        Portal under the Campaigns section once a campaign has been successfully
        run. |

        | Destination Number (`phone`) | The destination mobile number to which
        the message will be sent. |

        | Dynamic Values (`params`) | The number of dynamic values to be passed,
        as defined in the template. |

        | Successful Response | Returns `status: success` and a unique `ref_id`
        identifying the request. |
  /api/sms/template/send:
    post:
      summary: Template Send
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer 154|U2o3kT3Sl0It6aZxrPqDgZjXx1jr3SGzD5FXjVFM83fd0ba1
      responses: {}
      tags:
        - SMS
      security:
        - BearerAuth: []
      description: >-
        | Field | Description |

        | --- | --- |

        | API Name | Template Send |

        | Purpose | Sends SMS using a CPaaS+ template with dynamic variables. |

        | Method | `POST` |

        | Endpoint | `{{BaseURL}}/api/sms/template/send` |

        | Template ID | Obtain the CPaaS+ Template ID from Web Portal → SMS
        Channel → Template tab → select the specific template. |

        | Variable sequence | Pass dynamic variable values in the same sequence
        as defined in the template. |

        | Request format | JSON body |

        | Successful response | Returns `status`, `message`, and a `data` array
        containing message submission details. |

        | Response interpretation | `submitted` means the message has been
        submitted to the provider for delivery; it does not confirm final
        delivery. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: |-
              {
                  "alias": "{{Template ID}}",   //CPaas+ Template ID from Webportal
                  "to": [
                      "{{Mobile Number}}"      //Multiple Mobile Numbers upto 50 can be passed
                  ],
                  "params": {
                      "1": "{{Var}}"          //Dynamic values can be passed in variables as defined in template
                  }
              }
  /api/sms/send:
    post:
      summary: Open Text
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{Bearer Token}}
      responses: {}
      tags:
        - SMS
      security:
        - BearerAuth: []
      description: >-
        StartFragment


        | Field | Description |

        | --- | --- |

        | API Name | Open Text |

        | Purpose | Sends freeform SMS text programmatically without relying on
        a pre-built portal campaign or template. |

        | Method | `POST` |

        | Endpoint | `{{BaseURL}}/api/sms/send` |

        | Request format | JSON body |

        | Sender ID (`from`) | Sender ID, source address, or header configured
        on the platform. |

        | Recipients (`to`) | Destination mobile number(s); the guide says up to
        100 numbers can be passed. |

        | Message (`text`) | The SMS content to be delivered. |

        | Encoding (`type`) | Optional: `N` = plain text (default), `U` =
        Unicode, `A` = auto-detect. |

        | Message category (`product`) | Optional: `Transactional`,
        `Promotional`, `OTP`, or `Other`. |

        | India-specific fields | `template_id` (DLT-registered Template ID) and
        `entity_id` (DLT-registered Entity ID) are mandatory for messages sent
        in India. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: array
                  items:
                    type: string
                text:
                  type: string
                type:
                  type: string
                product:
                  type: string
                template_id:
                  type: string
                entity_id:
                  type: string
            example:
              from: '{{Source/Sender/Header}}'
              to:
                - '{{Mobile Number}}'
              text: '{{Message Text}}'
              type: '{{''N'' for plain text (default), ''U'' for Unicode, ''A'' for auto}}'
              product: '{{Transactional,Promotional,OTP,Other}}'
              template_id: '{{Template ID,Mandatory in India}}'
              entity_id: '{{Entity ID, Mandatory in India}}'
  /api/sms/status:
    get:
      summary: Status
      parameters:
        - name: number
          in: query
          schema:
            type: string
          example: '{{Mobile Number}}'
        - name: id
          in: query
          schema:
            type: string
          example: '{{Message ID}}'
        - name: from
          in: query
          schema:
            type: string
          example: '{{Sender}}'
        - name: code
          in: query
          schema:
            type: string
          example: '{{Error Code}}'
        - name: status
          in: query
          schema:
            type: string
          example: '{{Status}}'
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{Bearer Token}}
      responses: {}
      tags:
        - SMS
      security:
        - BearerAuth: []
      description: >-
        | Field | Description |

        | --- | --- |

        | API Name | Status |

        | Purpose | Retrieves the Delivery Report (DLR) status of submitted SMS
        messages. |

        | Method | `GET` |

        | Endpoint | `{{BaseURL}}/api/sms/status` |

        | Query Parameters | Optional filters are available to retrieve message
        status information. |

        | Response | Returns matching message records and pagination
        information. |

        | Status values | `DELIVRD` and `FAILED` are status filter values. |
  /whatsapp/blocked-members:
    post:
      summary: Block User
      responses: {}
      tags:
        - WhatsApp
        - User Management
      security:
        - BearerAuth: []
      description: >-
        **Block User API**


        ## 1\. API Overview


        | Field | Description |

        | --- | --- |

        | API Name | Block User |

        | Purpose | Blocks mobile numbers from receiving WhatsApp messages
        through the specified WhatsApp Business Account (WABA). |

        | HTTP Method | `POST` |

        | Endpoint | `/api/whatsapp/blocked-members` |

        | Full URL | `{{baseurl}}/api/whatsapp/blocked-members` |

        | Authentication | Bearer Token |

        | Content-Type | `application/json` |

        | Accept | `application/json` |


        ## 2\. Request Headers


        | Key | Value | Description |

        | --- | --- | --- |

        | `Authorization` | `Bearer {{Bearer Token}}` | Authenticates the API
        request. |

        | `Content-Type` | `application/json` | Specifies that the request body
        is JSON. |

        | `Accept` | `application/json` | Specifies that the client accepts a
        JSON response. |


        ## 3\. Request Body Parameters


        | Parameter | Type | Required | Description | Example |

        | --- | --- | --- | --- | --- |

        | `sender_id` | String | Yes | WhatsApp Business Account (WABA) number.
        | `{{WABA Number}}` |

        | `phone_numbers` | Array | Yes | Mobile number or numbers to block. |
        `["{{Mobile Number}}"]` |


        ## 4\. Success Response


        | Field | Example Value | Description |

        | --- | --- | --- |

        | `status` | `success` | Indicates that the request succeeded. |

        | `message` | `User blocked successfully.` | Confirmation message. |

        | `data.phone` | `91XXXXXXXX` | Mobile number shown in the response. |

        | `data.blocked_at` | `2026-03-26 10:15:32` | Date and time shown for
        the block action. |


        ### Sample Success Response


        ``` json

        {
          "status": "success",
          "message": "User blocked successfully.",
          "data": {
            "phone": "91XXXXXXXX",
            "blocked_at": "2026-03-26 10:15:32"
          }
        }

         ```

        ## 5\. Error Handling


        | Error Condition | Error Message in Guide | Recommended Action |

        | --- | --- | --- |

        | Missing `sender_id` | `The sender_id field is required.` | Provide the
        WABA number in the request body. |

        | Missing `phone` | `The phone field is required.` | Provide the mobile
        number in the request body. |

        | Re-engagement check failure | `Re-engagement check failed: Failed to
        block due to re-engagement check failed` | Check that the user has
        interacted with the system within the previous 24 hours, for example
        through a Campaign, API, or Chatbot. |


        ## 6\. Troubleshooting


        | Issue | What to Check |

        | --- | --- |

        | Authentication failure | Verify that the Bearer Token is present and
        valid. |

        | Required field error | Check that the required request fields are
        provided. |

        | Re-engagement check failure | Verify the user's interaction with the
        system within the previous 24 hours. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: |-
              {
                  "sender_id": "{{WABA Number}}",
                  "phone_numbers": [
                      "{{Mobile Number}}" //Multiple Mobile numbers can be added in array
                  ]
              }
  /api/whatsapp/blocked-members:
    delete:
      summary: Unblock User
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses: {}
      tags:
        - WhatsApp
        - User Management
      security:
        - BearerAuth: []
      description: >-
        # Unblock User API


        ## 1\. API Overview


        | Field | Description |

        | --- | --- |

        | API Name | Unblock User |

        | Purpose | Removes the block on a mobile number so that it is no longer
        blocked through the specified WhatsApp Business Account (WABA). |

        | HTTP Method | `DELETE` |

        | Endpoint | `/api/whatsapp/blocked-members` |

        | Full URL | `{{baseurl}}/api/whatsapp/blocked-members` |

        | Authentication | Bearer Token |

        | Content-Type | `application/json` |

        | Accept | `application/json` |


        ## 2\. Request Headers


        | Key | Value | Description |

        | --- | --- | --- |

        | `Authorization` | `Bearer {{Bearer Token}}` | Authenticates the API
        request. |

        | `Content-Type` | `application/json` | Specifies that the request body
        is JSON. |

        | `Accept` | `application/json` | Specifies that the client accepts a
        JSON response. |


        ## 3\. Request Body Parameters


        | Parameter | Type | Required | Description | Example |

        | --- | --- | --- | --- | --- |

        | `sender_id` | String | Yes | WhatsApp Business Account (WABA) number.
        | `{{WABA Number}}` |

        | `phone` | String | Yes | Mobile number to unblock. | `{{Mobile
        Number}}` |


        ## 4\. Sample Request Body


        | Example | JSON |

        | --- | --- |

        | Request | See the JSON request body configured below in the Postman
        Body tab. |


        ## 5\. Success Response


        | Field | Example Value | Description |

        | --- | --- | --- |

        | `status` | `success` | Indicates that the request succeeded. |

        | `message` | `User unblocked successfully.` | Confirmation that the
        user was unblocked. |


        ### Sample Success Response


        ```

        {
          "status": "success",
          "message": "User unblocked successfully."
        }

         ```

        ## 6\. Troubleshooting


        | Issue | What to Check |

        | --- | --- |

        | Authentication failure | Verify the Bearer Token and confirm that it
        is valid. |

        | Required field error | Check that both `sender_id` and `phone` are
        included in the request body. |

        | User remains blocked | Verify the WABA number and mobile number, then
        check the API response. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: |-
              {
                  "sender_id": "{{WABA Number}}",
                  "phone_numbers": [
                      "{{Mobile Number}}", //Multiple Numbers can be added in array
                      "{{Mobile Number}}"
                  ]
              }
    get:
      summary: Request Blocked Users
      parameters:
        - name: sender_id
          in: query
          schema:
            type: string
          example: '{{WABA Number}}'
        - name: per_page
          in: query
          schema:
            type: integer
          example: 1
        - name: page
          in: query
          schema:
            type: integer
          example: 1
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses: {}
      tags:
        - WhatsApp
        - User Management
      security:
        - BearerAuth: []
      description: >-
        | Field | Details |

        | --- | --- |

        | API Name | Request Blocked Users |

        | Method | `GET` |

        | Endpoint | `{{Base URL}}/api/whatsapp/blocked-members?sender_id={{WABA
        Number}}&per_page={{Max 100}}&page={{Page number}}` |

        | Description | Retrieve the paginated list of all users blocked for a
        specific WABA number. |

        | `sender_id` | Required: Yes |

        | `sender_id` Description | Your WABA number passed as a query parameter
        |

        | `per_page` | Required: Optional |

        | `per_page` Description | Number of records to return per page.
        Default: 10 |

        | `page` | Required: Optional |

        | `page` Description | Page number for pagination. Default: 1 |

        | `Accept` | `application/json` |

        | `Authorization` | `Bearer {{Bearer Token}}` |


        ### **Request**


        ``` bash

        curl --location --request GET \

        'https://api.yourcpaas.com/api/whatsapp/blocked-members?sender_id=WABANumber&per_page=10&page=1'
        \

        --header 'Accept: application/json' \

        --header 'Authorization: Bearer {{Bearer Token}}'

         ```

        ### Success Response


        ``` json

        {
          "status": "success",
          "data": {
            "total": 250,
            "per_page": 10,
            "current_page": 1,
            "blocked_members": [
              {
                "phone": "91XXXXXXXX",
                "blocked_at": "2026-03-26 10:15:32"
              },
              {
                "phone": "919123456789",
                "blocked_at": "2026-03-25 08:30:00"
              }
            ]
          }
        }

         ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sender_id:
                  type: string
            example:
              sender_id: '{{meta}}'
  /whatsapp/blocked-members/import-csv:
