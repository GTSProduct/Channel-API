        | Endpoint | `/api/whatsapp/msg` |

        | Base URL | `https://api.yourcpaas.com` |

        | Full URL | `{{Base URL}}/api/whatsapp/msg` |

        | Purpose | Sends an approved WhatsApp Business message template to a
