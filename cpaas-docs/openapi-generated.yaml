        | Authentication | Bearer Token |

        | Content-Type | `application/json` |

        | Accept | `application/json` |

        | Authorization Header | `Bearer {{Bearer Token}}` |

        | Required Parameter – `source` | WABA number |

        | Required Parameter – `destination` | Destination mobile number |

        | Required Parameter – `template.id` | Approved WhatsApp template ID |

        | Optional Parameter – `media_url` | Publicly hosted media URL |

        | Optional Parameter – `params` | Template variables |
