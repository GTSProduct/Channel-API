  /api/verify/validate-otp:
    post:
      summary: OTP Verification
      parameters:
        - name: unique_id
          in: query
          description: API response while triggering Verification Request
          schema:
            type: string
          example: '{{Unique_Id}}'
        - name: otp
          in: query
          description: OTP Value received in email
          schema:
            type: string
          example: '{{OTP Received in Email}}'
      responses: {}
      tags:
        - Email
      security:
        - BearerAuth: []
      description: >-
        | Field | Description |

        | --- | --- |

        | API Name | OTP Verification |

        | HTTP Method | POST |

        | Endpoint | `/api/verify/validate-otp` |

        | Base URL | `https://api.yourcpaas.com` |

        | Full URL | `{{Base
        URL}}/api/verify/validate-otp?unique_id={{Unique_Id}}&otp={{OTP}}` |

        | Purpose | Validates the OTP entered by the user and returns a
        `verified` true/false result. |

        | Authentication | Bearer Token |

        | Content-Type | `application/json` |

        | Accept | `application/json` |

        | Authorization Header | `Bearer {{Bearer Token}}` |

        | Request Format | Query parameters in the URL |

        | Required Parameter – `unique_id` | Session ID returned by the OTP
        Generation/Send API. |

        | Required Parameter – `otp` | OTP value entered by the user for
        validation. |


        ### Success Response


        ``` json

        {
          "status": "success",
          "message": "OTP verified successfully.",
          "data": {
            "verified": true,
            "unique_id": "otp-sess-a1b2c3d4e5f6"
          }
        }

         ```

        ### Error Responses


        Wrong OTP


        ``` json

        {
          "status": "error",
          "message": "Invalid OTP.",
          "data": {
            "verified": false
          }
        }

         ```

        Expired OTP


        ``` json

        {
          "status": "error",
          "message": "OTP has expired. Please request a new OTP.",
          "data": {
            "verified": false
          }
        }

         ```

        ### Error details


        | Field | Error | Resolution |

        | --- | --- | --- |

        | `unique_id` | The `unique_id` field is required. | Add the `unique_id`
        from the OTP Send API response. |

        | `otp` | The `otp` field is required. | Add the OTP entered by the
        user. |

        | `otp` | Invalid OTP | The entered OTP does not match; ask the user to
        re-enter it. |

        | `unique_id` | OTP has expired | Call the OTP Send API again to
        generate a new OTP. |
