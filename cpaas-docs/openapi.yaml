      - from_name
      - to
      - subject
      properties:
        service_name:
          type: string
          description: Service name of the email configuration.
        template_name:
          type: string
          description: Name of the email template.
        from:
          type: string
          description: Sender address on your configured domain.
        from_name:
          type: string
          description: Display name for the sender.
        to:
          type: string
          format: email
          description: Destination email address.
        cc:
          type: array
          items:
            type: string
            format: email
        bcc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
          description: Subject line.
        params:
          type: array
          items:
            type: string
          description: Template variable values, in the order defined in the template.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/EmailAttachment'
    EmailOpenTextRequest:
      type: object
      required:
      - account
