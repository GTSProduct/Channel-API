  /api/verify/send-otp:
    post:
      tags:
      - Email Verification
      operationId: sendEmailOtp
      summary: Generate and send an OTP
      description: 'Generates a time-limited OTP and delivers it using the verification template configured in the
        portal (Templates, then OTP Templates). Store the `unique_id` from the response: it is required to validate
        the OTP.'
      parameters:
      - name: verification_id
        in: query
        required: true
        description: Verification ID fetched from the verification template in the CPaaS+ portal.
        schema:
          type: string
      - name: type
        in: query
        required: true
        description: Delivery channel for the OTP.
        schema:
          type: string
          enum:
          - email
      - name: email
        in: query
        required: true
        description: Destination email address.
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
              example:
                status: success
                message: OTP sent successfully.
                data:
                  unique_id: otp-sess-hpzv07gryhdr
                  expires_in: 300
                  channel: email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/verify/validate-otp:
    post:
      tags:
      - Email Verification
      operationId: validateEmailOtp
      summary: Validate an OTP
      description: 'Validates the OTP entered by the user against the `unique_id` returned by the send call. Returns
        `verified: true` on success. A wrong or expired OTP returns `status: error` with `verified: false`.'
      parameters:
      - name: unique_id
        in: query
        required: true
        description: Unique ID returned in the response of the send-OTP request.
        schema:
          type: string
      - name: otp
        in: query
        required: true
        description: OTP value entered by the user.
        schema:
          type: string
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpValidateResponse'
              examples:
                verified:
                  summary: OTP verified
                  value:
                    status: success
                    message: OTP verified successfully.
                    data:
                      verified: true
                      unique_id: otp-sess-hpzv07gryhdr
                wrongOtp:
                  summary: Wrong OTP
                  value:
                    status: error
                    message: Invalid OTP.
                    data:
                      verified: false
                expired:
                  summary: Expired OTP
                  value:
                    status: error
                    message: OTP has expired. Please request a new OTP.
                    data:
                      verified: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/rcs/template/create:
    post:
      tags:
      - RCS Templates
      operationId: createRcsTemplate
      summary: Create an RCS template
      description: |-
        Creates an RCS template. Set `type` to choose the format:

        - `text_message`: text with up to 11 suggestion buttons
        - `rich_card`: a single card with media, title, description and up to 4 buttons
        - `carousel`: 2 to 10 cards, each with up to 4 buttons


        Templates are reviewed before use. The response returns `approval_status` (`pending`, `approved` or `rejected`); send only after approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/RcsTemplateText'
              - $ref: '#/components/schemas/RcsTemplateRichCard'
              - $ref: '#/components/schemas/RcsTemplateCarousel'
              discriminator:
                propertyName: type
                mapping:
                  text_message: '#/components/schemas/RcsTemplateText'
                  rich_card: '#/components/schemas/RcsTemplateRichCard'
                  carousel: '#/components/schemas/RcsTemplateCarousel'
            examples:
              textWithButtons:
                summary: Plain text + buttons
                value:
                  name: order_ready
                  agent_id: your-agent-id
                  type: text_message
                  textMessageContent: Hello {{name}}, your order {{order_id}} is ready for pickup!
                  suggestions:
                  - suggestionType: reply
                    displayText: Opt out
                    postback: opt_out
                  - suggestionType: url_action
                    displayText: View Details
                    url: https://example.com/order/{{order_id}}
                    postback: view_details
                  - suggestionType: dialer_action
                    displayText: Call Support
                    phoneNumber: '+91XXXXXXXXXX'
                    postback: call_support
              richCard:
                summary: Media + buttons
                value:
                  name: promo_card
                  agent_id: your-agent-id
                  type: rich_card
                  orientation: VERTICAL
                  height: SHORT_HEIGHT
                  standAlone:
                    cardTitle: Festive Offer
                    cardDescription: Flat 20% off on all orders this week.
                    mediaUrl: https://example.com/media/offer.jpg
                    suggestions:
                    - suggestionType: url_action
                      displayText: Shop Now
                      url: https://example.com/shop
                      postback: shop_now
              carousel:
                summary: Carousel
                value:
                  name: catalogue_carousel
                  agent_id: your-agent-id
                  type: carousel
                  width: MEDIUM_WIDTH
                  height: MEDIUM_HEIGHT
                  carouselList:
                  - cardTitle: Product A
                    cardDescription: Lightweight and durable.
                    mediaUrl: https://example.com/media/a.jpg
                    suggestions:
                    - suggestionType: url_action
                      displayText: View
                      url: https://example.com/a
                      postback: view_a
                  - cardTitle: Product B
                    cardDescription: Our best seller.
                    mediaUrl: https://example.com/media/b.jpg
                    suggestions:
                    - suggestionType: url_action
                      displayText: View
                      url: https://example.com/b
                      postback: view_b
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcsTemplateCreateResponse'
              example:
                status: success
                message: Template created successfully.
                data:
                  template_id: rcs-tpl-20260326-001
                  name: order_ready_v1
                  approval_status: pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/rcs/send:
    post:
      tags:
      - RCS Messaging
      operationId: sendRcsMessage
      summary: Send an RCS message
      description: |-
        Sends an approved RCS message over the **Vi** (Vodafone Idea) or **Jio** network in India. Choose the format with `message_type` (`text_message`, `rich_card` or `carousel`); the `content` structure must match.

        Jio supports extra button types (`calendar_event`, `share_location`, `view_location_query`, `view_location_latlong`). Jio-only button types cannot be used on Vi. Templates must be approved, and media URLs must be direct, publicly accessible HTTPS links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RcsSendRequest'
            examples:
              viText:
                summary: 'Vi: text with buttons'
                value:
                  botId: YOUR_VI_BOT_ID
                  to: '91XXXXXXXXXX'
                  message_type: text_message
                  content:
                    textMessageContent: Hello John, your order ORD-9876 is ready for pickup!
                    suggestions:
                    - suggestionType: reply
                      displayText: Confirm Pickup
                      postback: confirm_pickup
                    - suggestionType: url_action
                      displayText: Track Order
                      url: https://tracking.example.com/ORD-9876
                      postback: track_order
                    - suggestionType: dialer_action
                      displayText: Call Support
                      phoneNumber: '+91XXXXXXXXXX'
                      postback: call_support
              viRichCard:
                summary: 'Vi: rich card'
                value:
                  botId: YOUR_VI_BOT_ID
                  to: '91XXXXXXXXXX'
                  message_type: rich_card
                  content:
                    orientation: VERTICAL
                    height: MEDIUM_HEIGHT
                    standAlone:
                      cardTitle: Festive Offer
                      cardDescription: Flat 20% off this week.
                      mediaUrl: https://cdn.example.com/sale_banner.jpg
                      suggestions:
                      - suggestionType: url_action
                        displayText: Shop Now
                        url: https://example.com/shop
                        postback: shop_now
                      - suggestionType: reply
                        displayText: Opt Out
                        postback: opt_out
              jioText:
                summary: 'Jio: text with extended buttons'
                value:
                  botId: YOUR_JIO_BOT_ID
                  to: '91XXXXXXXXXX'
                  message_type: text_message
                  content:
                    textMessageContent: Your appointment is confirmed for March 30, 2026 at 10:00 AM.
                    suggestions:
                    - suggestionType: calendar_event
                      displayText: Add to Calendar
                      postback: add_calendar
                    - suggestionType: view_location_latlong
                      displayText: View Location
                      postback: view_location
                    - suggestionType: reply
                      displayText: Confirm
                      postback: confirm_appt
                    - suggestionType: reply
                      displayText: Cancel
                      postback: cancel_appt
              jioCarousel:
                summary: 'Jio: carousel'
                value:
                  botId: YOUR_JIO_BOT_ID
                  to: '91XXXXXXXXXX'
                  message_type: carousel
                  content:
                    width: MEDIUM_WIDTH
                    height: MEDIUM_HEIGHT
                    carouselList:
                    - cardTitle: Wireless Headphones
                      cardDescription: 40hr battery, noise cancellation.
                      mediaUrl: https://cdn.example.com/headphones.jpg
                      suggestions:
                      - suggestionType: url_action
                        displayText: Buy Now
                        url: https://example.com/product/1
                        postback: buy_1
                    - cardTitle: Smart Watch
                      cardDescription: Track fitness and stay connected.
                      mediaUrl: https://cdn.example.com/watch.jpg
                      suggestions:
                      - suggestionType: url_action
                        displayText: Buy Now
                        url: https://example.com/product/2
                        postback: buy_2
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcsSendResponse'
              example:
                status: success
                message: RCS message sent successfully.
                data:
                  message_id: rcs-vi-msg-lnbg0tyrvn
                  to: '91XXXXXXXXXX'
                  status: submitted
                  received_at: '2026-03-26 10:15:32'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
