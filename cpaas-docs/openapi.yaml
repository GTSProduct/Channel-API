        width:
          type: string
          enum:
          - SMALL_WIDTH
          - MEDIUM_WIDTH
        height:
          type: string
          enum:
          - SHORT_HEIGHT
          - MEDIUM_HEIGHT
        carouselList:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/RcsTemplateCard'
    RcsSuggestion:
      type: object
      required:
      - suggestionType
      - displayText
      description: |
        A button attached to a message. Which extra fields apply depends on `suggestionType`:
        `url_action` (url, application), `dialer_action` (phoneNumber), `calendar_event`
        (title, startTime, endTime, timeZone, description), `view_location_query` (query),
        `view_location_latlong` (label, latitude, longitude). `reply` and `share_location` need only
        `displayText` and `postback`.
      properties:
        suggestionType:
          type: string
          enum:
          - reply
          - url_action
          - dialer_action
          - share_location
          - calendar_event
          - view_location_query
          - view_location_latlong
        displayText:
          type: string
        postback:
          type: string
          description: Custom value returned when the button is tapped.
        url:
          type: string
        application:
          type: string
          description: Application used to open the URL, for example `BROWSER`.
        phoneNumber:
          type: string
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          description: Format `YYYY-MM-DD HH:MM:SS`.
        endTime:
          type: string
          description: Format `YYYY-MM-DD HH:MM:SS`.
        timeZone:
          type: string
          description: ISO 8601 with zone, for example `2025-11-05T10:30:00[Asia/Kolkata]`.
        query:
          type: string
        label:
          type: string
        latitude:
          type: string
        longitude:
          type: string
    RcsCard:
      type: object
      properties:
        mediaUrl:
          type: string
          format: uri
        cardTitle:
          type: string
        cardDescription:
          type: string
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/RcsSuggestion'
    RcsContent:
      type: object
      description: 'Message content. The structure must match `message_type`: `text_message` uses `textMessageContent`
        and optional `suggestions` (max 11); `rich_card` uses `orientation`, `height` and `standAlone` (max 4 buttons);
        `carousel` uses `width`, `height` and `carouselList` (2 to 10 cards, max 4 buttons each).'
      properties:
        textMessageContent:
          type: string
        height:
          type: string
          description: '`SHORT_HEIGHT`, `MEDIUM_HEIGHT` or `TALL_HEIGHT` (rich card); `SHORT_HEIGHT` or `MEDIUM_HEIGHT`
            (carousel).'
        width:
          type: string
          description: '`SMALL_WIDTH` or `MEDIUM_WIDTH` (carousel).'
        alignment:
          type: string
          enum:
          - LEFT
          - RIGHT
        orientation:
          type: string
          enum:
          - HORIZONTAL
          - VERTICAL
        standAlone:
          $ref: '#/components/schemas/RcsCard'
        carouselList:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/RcsCard'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/RcsSuggestion'
    RcsSendRequest:
      type: object
      properties:
        botId:
          type: string
          description: RCS bot / agent ID registered on the operator network (from the portal under RCS, then Agents).
        to:
          type: string
          description: Destination mobile number.
        message_type:
          type: string
          description: Type of message.
          enum:
          - text_message
          - rich_card
          - carousel
        content:
          $ref: '#/components/schemas/RcsContent'
      required:
      - botId
      - to
      - message_type
      - content
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          description: '`error` on platform errors.'
        error_code:
          type: integer
          description: HTTP-style error code.
        error_message:
          type: string
          description: Human-readable error.
        message:
          type: string
          description: Human-readable error (validation style).
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-level validation errors keyed by field name.
      description: 'Error body. The exact fields present depend on the failure: validation failures return `message`
        and `errors`; platform failures return `status`, `error_code` and `error_message`.'
    Pagination:
      type: object
      properties:
        total:
          type: integer
        count:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        total_pages:
          type: integer
    SmsSubmitResult:
      type: object
      properties:
        status:
          type: string
          description: '`submitted` or `failed` for this recipient.'
          enum:
          - submitted
          - failed
        message_id:
          type:
          - string
          - 'null'
          description: Unique message ID. `null` when the entry failed. Use it with the status endpoint.
        number:
          type: string
          description: Destination number for this entry.
        units:
          type: integer
          description: SMS units consumed. One unit is 160 characters of plain text or 70 characters of Unicode.
        error:
          type: string
          description: Reason, present when `status` is `failed` (for example `Invalid phone number`).
        received_at:
          type: string
          description: Timestamp the platform received the request (`YYYY-MM-DD HH:MM:SS`).
    SmsSendResponse:
      type: object
      properties:
        status:
          type: string
          description: Overall submission status.
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/SmsSubmitResult'
      description: 'Per-recipient results. The API supports partial success: an HTTP 200 can contain both submitted
        and failed entries, so always inspect each entry in `data`.'
    SmsCampaignResponse:
      type: object
      properties:
        status:
          type: string
          description: '`success` means the message was submitted, not delivered.'
        ref_id:
          type: string
          description: Unique identifier (message ID) of the request.
    SmsStatusResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              message_id:
                type: string
              from:
                type: string
              number:
                type: string
              status:
                type: string
                description: Delivery status, for example `DELIVRD` or `FAILED`.
              code:
                type: string
                description: Delivery code captured from the operator.
              units:
                type: integer
              received_at:
                type: string
              submitted_at:
                type: string
              dlr_received_at:
                type:
                - string
                - 'null'
                description: Delivery-report timestamp, or null if not yet received.
        pagination:
          $ref: '#/components/schemas/Pagination'
    WhatsAppMessageResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            message_id:
              type: string
              description: WhatsApp message ID returned by Meta (`wamid...`).
            receiver:
              type: string
              description: Destination WhatsApp number.
            status:
              type: string
              description: Delivery pipeline status.
              enum:
              - submitted
              - failed
    OrderStatusResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            order_id:
              type: string
            updated_status:
              type: string
            notified_at:
              type: string
              description: Time the customer was notified (`YYYY-MM-DD HH:MM:SS`).
    RefundResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            refund_id:
              type: string
              description: Unique refund transaction ID.
            order_id:
              type: string
            refund_amount:
              type: string
            currency:
              type: string
            refund_status:
              type: string
              description: Refund transaction status.
              enum:
              - processing
              - completed
              - failed
    BlockUserResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            phone:
              type: string
            blocked_at:
              type: string
    UnblockUserResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    CsvImportResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            total:
              type: integer
              description: Records found in the CSV.
            blocked:
              type: integer
              description: Users blocked successfully.
            failed:
              type: integer
              description: Entries that failed (invalid format or duplicates).
    BlockedUsersResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            total:
              type: integer
            per_page:
              type: integer
            current_page:
              type: integer
            blocked_members:
              type: array
              items:
                type: object
                properties:
                  phone:
                    type: string
                  blocked_at:
                    type: string
    SyncBlockedResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            synced:
              type: integer
            synced_at:
              type: string
    EmailSendResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            message_id:
              type: string
              description: Unique email message ID. Use it with the status endpoint.
            to:
              type: string
            status:
              type: string
              description: Delivery pipeline status.
              enum:
              - queued
              - sent
              - failed
    EmailStatusResponse:
      type: object
      properties:
        message_id:
          type: string
        status:
          type: string
          description: Current status, for example `queued`, `sent`, `delivered`, `opened` or `failed`.
        timeline:
          type: object
          properties:
            queued_at:
              type:
              - string
              - 'null'
            sent_at:
              type:
              - string
              - 'null'
            delivered_at:
              type:
              - string
              - 'null'
            opened_at:
              type:
              - string
              - 'null'
            clicked_at:
              type:
              - string
              - 'null'
            bounced_at:
              type:
              - string
              - 'null'
            failed_at:
              type:
              - string
              - 'null'
            unsubscribed_at:
              type:
              - string
              - 'null'
            complained_at:
              type:
              - string
              - 'null'
          description: ISO 8601 timestamps; `null` for events that have not happened.
        recipient:
          type: string
        subject:
          type: string
        details:
          type: object
          properties:
            open_count:
              type: integer
            click_count:
              type: integer
    OtpSendResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            unique_id:
              type: string
              description: 'OTP session ID. Store it: it is required to validate the OTP.'
            expires_in:
              type: integer
              description: OTP validity in seconds (default 300).
            channel:
              type: string
    OtpValidateResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            verified:
              type: boolean
              description: '`true` if the OTP matched and is valid; `false` if incorrect or expired.'
            unique_id:
              type: string
    RcsTemplateCreateResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            template_id:
              type: string
              description: Internal template ID.
            name:
              type: string
            approval_status:
              type: string
              description: Review status. Send only after the template is approved.
              enum:
              - pending
              - approved
              - rejected
    RcsSendResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            message_id:
              type: string
              description: Unique RCS message ID. Use it with the status endpoint.
            to:
              type: string
            status:
              type: string
              description: Delivery pipeline status.
              enum:
              - submitted
              - failed
            received_at:
              type: string
    RcsStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            message_id:
              type: string
            status:
              type: string
              description: Current delivery status, for example `submitted`, `delivered`, `read` or `failed`.
            status_description:
              type: string
            message_type:
              type: string
            priority:
              type:
              - string
              - 'null'
            direction:
              type: string
            number:
              type: string
            created_at:
              type:
              - string
              - 'null'
            scheduled_at:
              type:
              - string
              - 'null'
            sent_at:
              type:
              - string
              - 'null'
            delivered_at:
              type:
              - string
              - 'null'
            failed_at:
              type:
              - string
              - 'null'
            cancelled_at:
              type:
              - string
              - 'null'
            updated_at:
              type:
              - string
              - 'null'
    FlowTriggerResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    SmsBulkRequest:
      type: object
      properties:
        root:
          type: object
          properties:
            from:
              type: string
              description: Default sender ID / header, used when an entry omits `from`.
            text:
              type: string
              description: Default message text, used when an entry omits `text`.
            to:
              type: array
              items:
                type: string
              description: Default destination number(s), used when an entry omits `to`.
          required:
          - from
          - text
          - to
          description: Fallback values applied to any `data[]` entry that omits `from`, `text` or `to`.
        data:
          type: array
          maxItems: 500
          description: Individual messages. Maximum 500 per request.
          items:
            type: object
            properties:
              from:
                type: string
                description: Sender for this message. Overrides `root.from`.
              text:
                type: string
                description: Text for this message. Overrides `root.text`.
              to:
                type: array
                items:
                  type: string
                description: Destination number(s) for this entry. Overrides `root.to`.
      required:
      - root
      - data
