openapi: 3.1.0
info:
  title: CPaaS+ Messaging API
  version: 1.0.0
  description: |-
    Unified REST API for sending and managing customer communications across **SMS**, **WhatsApp**, **Email (including OTP verification)**, **RCS** and **Flow Builder**.

    All APIs are HTTP-based, use JSON and are secured with bearer-token authentication. Generate a token in the CPaaS+ portal (API tab, then **Add new Token**) and send it as `Authorization: Bearer <token>` on every request.

    A `200` response means the request was **accepted**, not that the message was delivered. Use the status endpoints for delivery results.
servers:
- url: '{baseUrl}'
  description: Your CPaaS+ API host (provided at onboarding)
  variables:
    baseUrl:
      default: https://api.yourcpaas.com
      description: Host of your CPaaS+ web portal account, without a trailing slash.
security:
- bearerAuth: []
tags:
- name: SMS
  description: Send SMS using portal campaigns, approved templates, or open text, and check delivery status.
- name: WhatsApp Messaging
  description: Send WhatsApp template messages and manage order status and refunds.
- name: WhatsApp User Management
  description: Block, unblock, bulk-import and sync blocked WhatsApp users for a WABA number.
- name: Email
  description: Send template-based or open-text email and check delivery status.
- name: Email Verification
  description: Generate and validate one-time passwords (OTP) delivered by email.
- name: RCS Templates
  description: Create RCS templates (text with buttons, rich card, carousel).
- name: RCS Messaging
  description: Send RCS messages and check message status.
- name: Flow Builder
  description: Trigger a Flow Builder journey with contact data.
paths:
  /api/sms/send-msg:
    post:
      tags:
      - SMS
      operationId: sendSmsCampaign
      summary: Send SMS using a campaign
      description: |-
        Sends a single SMS using a campaign created in the web portal. Provide the destination number and the dynamic values. No request body is needed. Send `Content-Type: text/plain`.

        A `success` status means the message was submitted, not delivered.
      parameters:
      - name: campaign_id
        in: query
        required: true
        description: Campaign ID generated in the web portal under **Campaigns**.
        schema:
          type: string
        example: '1234'
      - name: phone
        in: query
        required: true
        description: Destination mobile number the message will be delivered to.
        schema:
          type: string
        example: '91XXXXXXXXXX'
      - name: params
        in: query
        required: true
        description: JSON array (URL-encoded) of the dynamic values defined in the campaign template, in order.
          A count mismatch returns an error.
        schema:
          type: string
        example: '["Asha","ORD-1001","25 Dec"]'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsCampaignResponse'
              example:
                status: success
                ref_id: 26f5b436-7377-4574-9173-c07e81b164d5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sms/template/send:
    post:
      tags:
      - SMS
      operationId: sendSmsTemplate
      summary: Send SMS using a template
      description: Sends an SMS based on a template (alias) created in the CPaaS+ web portal. Up to 50 recipients
        per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsTemplateSendRequest'
            example:
              alias: TPL_ORDER_CONFIRM
              to:
              - '91XXXXXXXXXX'
              params:
                '1': ORD-1001
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
              example:
                status: success
                message: Messages are sent successfully.
                data:
                - status: submitted
                  message_id: d0056007-2e32-44fa-beb7-1dbdfb0d8bc2
                  number: '91XXXXXXXXXX'
                  units: 1
                  received_at: '2026-03-25 20:13:54'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sms/send:
    post:
      tags:
      - SMS
      operationId: sendSmsOpenText
      summary: Send SMS with open text
      description: Sends an SMS with free-form text to up to 100 numbers. In India, `template_id` and `entity_id`
        (DLT) are mandatory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsOpenTextRequest'
            example:
              from: CPAAS
              to:
              - '91XXXXXXXXXX'
              text: Your order ORD-1001 has been shipped.
              type: N
              product: Transactional
              template_id: '1107160000000000000'
              entity_id: '1101160000000000000'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
              example:
                status: success
                message: Messages are sent successfully.
                data:
                - status: submitted
                  message_id: ce73930a-687b-49f5-a4c8-80e816b9b458
                  number: '91XXXXXXXXXX'
                  units: 1
                  received_at: '2026-03-26 19:41:10'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sms/json:
    post:
      tags:
      - SMS
      operationId: sendSmsBulk
      summary: Send bulk SMS
      description: |-
        Sends the same message to many numbers, or personalised messages to different numbers, in one call using the `data` array (maximum 500 entries). Entries that omit `from`, `text` or `to` use the `root` values.

        The API supports **partial success**: some entries may succeed while others fail in the same call. Check each entry in `data`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsBulkRequest'
            example:
              root:
                from: CPAAS
                text: Hello, your order is confirmed.
                to:
                - '91XXXXXXXXXX'
              data:
              - from: PROMO
                text: Hi John, your OTP is 485923
                to:
                - '91XXXXXXXXXX'
              - from: PROMO
                text: Hi Priya, your OTP is 736104
                to:
                - '91XXXXXXXXXX'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
              example:
                status: success
                message: Messages are sent successfully.
                data:
                - status: submitted
                  message_id: d01c11ce-755e-4d03-900f-e185bf87bbe9
                  number: '91XXXXXXXXXX'
                  units: 1
                  received_at: '2026-03-26 10:15:32'
                - status: failed
                  message_id: null
                  number: '9199'
                  units: 0
                  error: Invalid phone number
                  received_at: '2026-03-26 10:15:32'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sms/status:
    get:
      tags:
      - SMS
      operationId: getSmsStatus
      summary: Get SMS status
      description: Retrieves delivery reports (DLR). All filters are optional and can be combined. Results are paginated
        (default and maximum 100 per page).
      parameters:
      - name: number
        in: query
        required: false
        description: Filter by destination mobile number.
        schema:
          type: string
      - name: id
        in: query
        required: false
        description: Filter by message ID.
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Filter by sender / header.
        schema:
          type: string
      - name: code
        in: query
        required: false
        description: Filter by the delivery code captured from the operator.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter by message status.
        schema:
          type: string
          enum:
          - DELIVRD
          - FAILED
      - name: page
        in: query
        required: false
        description: Page number.
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: Records per page. Maximum 100; can be limited to 50, 25 or 10.
        schema:
          type: integer
          maximum: 100
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsStatusResponse'
              example:
                status: success
                data:
                - message_id: 5f3747eb-f92e-4b1a-97bf-72b8e00b75e9
                  from: SENDER
                  number: '91XXXXXXXXXX'
                  status: FAILED
                  code: '105'
                  units: 1
                  received_at: '2025-09-30 04:34:14'
                  submitted_at: '2025-09-30 04:34:14'
                  dlr_received_at: null
                pagination:
                  total: 1
                  count: 1
                  per_page: 100
                  current_page: 1
                  total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/whatsapp/msg:
    post:
      tags:
      - WhatsApp Messaging
      operationId: sendWhatsAppMessage
      summary: Send a WhatsApp template message
      description: |-
        Sends an approved WhatsApp template message. Templates must be approved in Meta Business Manager before sending. Include `media_url` for templates with an image, video or document header.

        If the template has dynamic variables, pass the required `template.params` even when sending with media.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppMessageRequest'
            examples:
              withoutMedia:
                summary: Template with variables
                value:
                  source: '91XXXXXXXXXX'
                  destination: '91XXXXXXXXXX'
                  template:
                    id: order_update
                    params:
                    - Asha
                    - ORD-1001
              withMedia:
                summary: Template with a media header
                value:
                  source: '91XXXXXXXXXX'
                  destination: '91XXXXXXXXXX'
                  template:
                    id: invoice_share
                  media_url: https://example.com/files/invoice.pdf
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessageResponse'
              example:
                status: success
                message: Message sent successfully.
                data:
                  message_id: wamid.RpbCVV2HEWfRuwiXDz5EqRRLmTy0laGmDSIH
                  receiver: '91XXXXXXXXXX'
                  status: submitted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/whatsapp/{source}/order-status/update:
    post:
      tags:
      - WhatsApp Messaging
      operationId: updateWhatsAppOrderStatus
      summary: Update order status
      description: Updates the order status in a WhatsApp Commerce conversation and notifies the customer of fulfilment
        events (confirmed, shipped, delivered, cancelled).
      parameters:
      - name: source
        in: path
        required: true
        description: WhatsApp sender ID (WABA number) the order belongs to.
        schema:
          type: string
        example: '91XXXXXXXXXX'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusRequest'
            example:
              order_id: ORD-9876
              status: shipped
              tracking_url: https://tracking.example.com/ORD-9876
              description: Your order has been dispatched via Blue Dart.
              receiver: '91XXXXXXXXXX'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
              example:
                status: success
                message: Order status updated successfully.
                data:
                  order_id: ORD-9876
                  updated_status: shipped
                  notified_at: '2026-03-26 10:15:32'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/whatsapp/{account}/payment/refund:
    post:
      tags:
      - WhatsApp Messaging
      operationId: refundWhatsAppOrder
      summary: Refund an order payment
      description: Triggers a payment refund for a WhatsApp Commerce order and notifies the customer on WhatsApp
        with the refund details.
      parameters:
      - name: account
        in: path
        required: true
        description: Account identifier segment for the payment endpoint, as provided by CPaaS+ at onboarding.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            example:
              order_id: ORD-9876
              refund_amount: '1499.00'
              currency: INR
              reason: customer_request
              receiver: '91XXXXXXXXXX'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
              example:
                status: success
                message: Refund initiated successfully.
                data:
                  refund_id: REF-20260326-890
                  order_id: ORD-9876
                  refund_amount: '1499.00'
                  currency: INR
                  refund_status: processing
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/whatsapp/blocked-members:
    get:
      tags:
      - WhatsApp User Management
      operationId: listBlockedUsers
      summary: List blocked users
      description: Returns a paginated list of users blocked for a WhatsApp sender.
      parameters:
      - name: sender_id
        in: query
        required: true
        description: WhatsApp Business (WABA) number.
        schema:
          type: string
        example: '91XXXXXXXXXX'
      - name: per_page
        in: query
        required: false
        description: Records per page (maximum 100). Default 10.
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 50
      - name: page
        in: query
        required: false
        description: Page number. Default 1.
        schema:
          type: integer
          minimum: 1
        example: 1
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUsersResponse'
              example:
                status: success
                data:
                  total: 250
                  per_page: 10
                  current_page: 1
                  blocked_members:
                  - phone: '91XXXXXXXXXX'
                    blocked_at: '2026-03-26 10:15:32'
                  - phone: '91XXXXXXXXXX'
                    blocked_at: '2026-03-25 08:30:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - WhatsApp User Management
      operationId: blockUsers
      summary: Block users
      description: Blocks a user from receiving messages from your WABA number. The user must have interacted with
        your system within the last 24 hours (for example via a campaign, API message or chatbot), otherwise the
        request fails with a re-engagement check error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedMembersRequest'
            example:
              sender_id: '91XXXXXXXXXX'
              phone: '91XXXXXXXXXX'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockUserResponse'
              example:
                status: success
                message: User blocked successfully.
                data:
                  phone: '91XXXXXXXXXX'
                  blocked_at: '2026-03-26 10:15:32'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - WhatsApp User Management
      operationId: unblockUsers
      summary: Unblock users
      description: Removes the block on a user so they can receive messages again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedMembersRequest'
            example:
              sender_id: '91XXXXXXXXXX'
              phone: '91XXXXXXXXXX'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnblockUserResponse'
              example:
                status: success
                message: User unblocked successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/whatsapp/blocked-members/import-csv:
    post:
      tags:
      - WhatsApp User Management
      operationId: importBlockedUsersCsv
      summary: Bulk block or unblock users from CSV
      description: Blocks multiple users at once by uploading a CSV file with one mobile number per row.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                sender_id:
                  type: string
                  description: Your WhatsApp Business (WABA) number.
                file:
                  type: string
                  format: binary
                  description: CSV file containing the mobile numbers to block, one per row.
              required:
              - sender_id
              - file
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportResponse'
              example:
                status: success
                message: CSV imported successfully.
                data:
                  total: 250
                  blocked: 248
                  failed: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/whatsapp/blocked-members/sync:
    post:
      tags:
      - WhatsApp User Management
      operationId: syncBlockedUsers
      summary: Sync blocked users
      description: Synchronises the blocked-users list stored in CPaaS+ with the WhatsApp Business Platform. Use
        it after bulk imports or manual changes to keep both consistent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sender_id
              properties:
                sender_id:
                  type: string
                  description: WhatsApp Business (WABA) number.
                  example: '91XXXXXXXXXX'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBlockedResponse'
              example:
                status: success
                message: Blocked users synced successfully.
                data:
                  synced: 250
                  synced_at: '2026-03-26 10:15:32'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/email/template/send:
    post:
      tags:
      - Email
      operationId: sendEmailTemplate
      summary: Send email using a template
      description: Sends an email based on a template configured in the CPaaS+ portal. Variables in `params` map
        to the template in order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateRequest'
            example:
              service_name: primary-email-service
              template_name: order_confirmation
              from: orders@example.com
              from_name: Example Store
              to: asha@example.com
              cc:
              - manager@example.com
              subject: Your order ORD-1001
              params:
              - Asha
              - ORD-1001
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSendResponse'
              example:
                status: success
                message: Email sent successfully.
                data:
                  message_id: email-jo3cp4m8gv8c
                  to: customer@example.com
                  status: queued
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/email/send:
    post:
      tags:
      - Email
      operationId: sendEmailOpenText
      summary: Send email with open text
      description: Sends an email with a free-form body, optional cc/bcc and base64-encoded attachments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOpenTextRequest'
            example:
              account: primary-email-service
              from: orders@example.com
              from_name: Example Store
              to: asha@example.com
              subject: Your invoice
              body: Hi Asha, please find your invoice attached.
              attachments:
              - filename: invoice.pdf
                type: application/pdf
                content: JVBERi0xLjQK...
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSendResponse'
              example:
                status: success
                message: Email sent successfully.
                data:
                  message_id: email-aiieoq1xh6kr
                  to: customer@example.com
                  status: queued
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/email/status:
    get:
      tags:
      - Email
      operationId: getEmailStatus
      summary: Get email status
      description: |-
        Retrieves the delivery status and event timeline of an email using the message ID returned by the send API.

        This endpoint is a `GET` that takes its `id` in a JSON request body.
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailStatusResponse'
              example:
                message_id: 3d778746-c991-44bc-ae46-c15af500673d
                status: delivered
                timeline:
                  queued_at: '2026-02-27T12:00:09.000000Z'
                  sent_at: '2026-02-27T12:00:09.000000Z'
                  delivered_at: '2026-02-27T12:00:11.000000Z'
