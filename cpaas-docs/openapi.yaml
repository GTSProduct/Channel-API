        filename:
          type: string
          description: File name including extension.
        type:
          type: string
          description: MIME type, for example `application/pdf`.
        content:
          type: string
          format: byte
          description: Base64-encoded file content.
    EmailTemplateRequest:
      type: object
      required:
      - service_name
      - template_name
