  /flow-api/webhook/trigger/{flow_id}:
    post:
      tags:
      - Flow Builder
      operationId: triggerFlow
      summary: Trigger a Flow Builder journey
      description: |-
        Triggers a published and active Flow Builder journey for a recipient. The flow then runs all configured steps (messages, conditions, delays).

        The endpoint is the flow's webhook URL, shown in the portal under Flow Builder, then your flow, then Webhook URL. Send `phone` if the flow uses SMS or WhatsApp, `email` if it uses Email, plus the variables (`var1`, `var2`, ...) your flow expects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Contact mobile number.
                  example: '91XXXXXXXXXX'
                email:
                  type: string
                  format: email
                  description: Contact email address.
                  example: asha@example.com
              additionalProperties:
                type: string
                description: Flow variables (for example `var1`, `var2`) as configured in your flow.
            example:
              phone: '91XXXXXXXXXX'
              email: asha@example.com
              var1: Asha
              var2: ORD-1001
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTriggerResponse'
              examples:
                ok:
                  summary: Triggered
                  value:
                    status: success
                    message: Flow jobs dispatched successfully
                notFound:
                  summary: Flow not found
                  value:
                    status: error
                    message: Flow not found.
                badJson:
                  summary: Invalid body
                  value:
                    status: error
                    message: Invalid JSON format. Please check your request body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: flow_id
        in: path
        required: true
        description: ID of the published flow, from its webhook URL.
        schema:
          type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token issued for your account. Send as `Authorization: Bearer <token>`.'
  responses:
    BadRequest:
      description: 'Bad request: invalid JSON or missing fields.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Forbidden: the request came from a restricted (non-allow-listed) IP address.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 'Unprocessable entity: invalid numbers or fields, or invalid message content.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: 'Internal server error: a server-side issue. Retry later or contact support.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SmsTemplateSendRequest:
      type: object
      required:
      - alias
      - to
      properties:
        alias:
          type: string
          description: Template ID (alias) from the CPaaS+ web portal.
        to:
          type: array
          maxItems: 50
          items:
            type: string
          description: Destination mobile numbers (up to 50).
        params:
          type: object
          additionalProperties:
            type: string
          description: 'Dynamic values keyed by variable position, as defined in the template (for example `{"1":
            "value"}`).'
    SmsOpenTextRequest:
      type: object
      required:
      - from
      - to
      - text
      properties:
        from:
          type: string
          description: Sender ID / source address / header as configured on the platform.
        to:
          type: array
          items:
            type: string
          description: Destination mobile numbers. Up to 100 per request.
          maxItems: 100
        text:
          type: string
          description: Message text.
        type:
          type: string
          enum:
          - N
          - U
          - A
          default: N
          description: '`N` plain text (default), `U` Unicode, `A` auto-detect.'
        product:
          type: string
          enum:
          - Transactional
          - Promotional
          - OTP
          - Other
          description: Traffic category.
        template_id:
          type: string
          description: Registered template ID. Mandatory in India.
        entity_id:
          type: string
          description: Registered entity ID. Mandatory in India.
    WhatsAppMessageRequest:
      type: object
      required:
      - source
      - destination
      - template
      properties:
        source:
          type: string
          description: WhatsApp sender ID (WABA number).
        destination:
          type: string
          description: Recipient phone number.
        template:
          type: object
          required:
          - id
          properties:
            id:
              type: string
              description: Approved WhatsApp template ID.
            params:
              type: array
              items:
                type: string
              description: Values for the template body variables, in order.
        media_url:
          type: string
          format: uri
          description: Public URL of a document, PDF or image for templates with a media header.
    OrderStatusRequest:
      type: object
      properties:
        order_id:
          type: string
          description: Unique order identifier from your system.
        status:
          type: string
          description: New order status.
          enum:
          - confirmed
          - shipped
          - delivered
          - cancelled
        tracking_url:
          type: string
          description: Publicly accessible shipment tracking URL to share with the customer.
          format: uri
        description:
          type: string
          description: Additional status notes for the customer.
        receiver:
          type: string
          description: Customer WhatsApp number.
      required:
      - order_id
      - status
      - receiver
    RefundRequest:
      type: object
      properties:
        order_id:
          type: string
          description: Unique order identifier to refund.
        refund_amount:
          type: string
          description: Amount to refund, in the order currency.
        currency:
          type: string
          description: ISO 4217 currency code, for example `INR` or `USD`.
        reason:
          type: string
          description: Reason for the refund, for example `customer_request` or `defective_product`.
        receiver:
          type: string
          description: Customer WhatsApp number to notify about the refund.
      required:
      - order_id
      - refund_amount
      - currency
      - receiver
    BlockedMembersRequest:
      type: object
      properties:
        sender_id:
          type: string
          description: Your WhatsApp Business (WABA) number.
        phone:
          type: string
          description: Mobile number of the user.
      required:
      - sender_id
      - phone
    EmailAttachment:
      type: object
